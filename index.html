<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Bingo - Choose Your Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header .logo {
            font-size: 48px;
            color: #FF0000;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF0000, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-top: 8px;
        }

        .card-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-option {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card-option:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-option:active {
            transform: scale(0.98);
        }

        .card-option .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #FF0000;
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .card-option .price {
            font-size: 36px;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 5px;
        }

        .card-option .price small {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
        }

        .card-option .label {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-option .description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        .card-option .features {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-option .feature-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
        }

        .card-option .feature-tag i {
            margin-right: 4px;
            color: #FFD700;
        }

        .card-option .prize-info {
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            font-size: 13px;
            color: #FFD700;
        }

        .card-option .prize-info i {
            margin-right: 6px;
        }

        /* Card 1: 10 birr (Standard) */
        .card-option.standard {
            --primary-color: #4CAF50;
        }
        .card-option.standard:hover {
            border-color: #4CAF50;
        }

        /* Card 2: 20 birr (VIP) */
        .card-option.vip {
            --primary-color: #FFD700;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08), rgba(255, 215, 0, 0.02));
            border-color: rgba(255, 215, 0, 0.3);
        }
        .card-option.vip:hover {
            border-color: #FFD700;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.15);
        }
        .card-option.vip .badge {
            background: #FFD700;
            color: #1a1a2e;
        }
        .card-option.vip .price {
            color: #FFD700;
        }

        .card-option .arrow {
            margin-top: 15px;
            text-align: right;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .card-option:hover .arrow {
            color: var(--primary-color, #FFD700);
            transform: translateX(5px);
        }

        .user-info {
            margin-top: 30px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-info .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .user-info .balance i {
            color: #FFD700;
        }

        .user-info .balance span {
            font-weight: 600;
            color: #FFD700;
        }

        .user-info .user-id {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .user-info .user-id i {
            margin-right: 4px;
        }

        /* Insufficient balance notification */
        .insufficient-balance-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #f44336;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 1000;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(244, 67, 54, 0.4);
            animation: slideDown 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .insufficient-balance-notification .small {
            font-size: 12px;
            opacity: 0.8;
            display: block;
            margin-top: 4px;
        }

        .insufficient-balance-notification .deposit-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .insufficient-balance-notification .deposit-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #access-denied {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            color: white;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        #access-denied i {
            font-size: 50px;
            color: #f44336;
            margin-bottom: 20px;
        }
        #access-denied h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #access-denied p {
            color: rgba(255, 255, 255, 0.6);
            max-width: 300px;
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 215, 0, 0.2);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            margin-top: 20px;
            color: #FFD700;
            font-size: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
            to {
                transform: translateX(-50%) translateY(-100%);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            .header h1 {
                font-size: 22px;
            }
            .card-option {
                padding: 20px;
            }
            .card-option .price {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div id="access-denied">
        <i class="fas fa-lock"></i>
        <h2>Access Restricted</h2>
        <p>This game can only be played inside the Telegram App.</p>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading game...</div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>VIP BINGO</h1>
            <p>Choose your card price and start playing!</p>
        </div>

        <!-- Card Options -->
        <div class="card-options">
            <!-- Option 1: 10 birr (Standard) -->
            <div class="card-option standard" onclick="selectGame(10)">
                <div class="badge">STANDARD</div>
                <div class="price">10 <small>birr</small></div>
                
                <div class="arrow"><i class="fas fa-arrow-right"></i></div>
            </div>

            <!-- Option 2: 20 birr (VIP) -->
            <div class="card-option vip" onclick="selectGame(20)">
                <div class="badge">🌟 VIP</div>
                <div class="price">20 <small>birr</small></div>
               
                <div class="arrow"><i class="fas fa-arrow-right"></i></div>
            </div>
        </div>

        <!-- User Info -->
        <div class="user-info">
            <div class="balance">
                <i class="fas fa-wallet"></i>
                Balance: <span id="wallet-balance">0.00</span> birr
            </div>
            <div class="user-id">
                <i class="fas fa-user"></i>
                <span id="user-id-display">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const API_BASE_URL = `${window.location.protocol}//${window.location.host}/api`;

        // ==================== TELEGRAM CHECK ====================
        let isTelegram = false;
        let tg = null;

        if (window.Telegram && window.Telegram.WebApp) {
            try {
                tg = window.Telegram.WebApp;
                if (tg.initData && tg.initData !== "") {
                    isTelegram = true;
                    console.log("✅ Telegram WebApp detected");
                }
            } catch(e) {
                console.log("Error accessing Telegram WebApp:", e);
            }
        }

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isTelegramUserAgent = /Telegram/i.test(userAgent);

        if (!isTelegram && !isTelegramUserAgent) {
            const deniedDiv = document.getElementById("access-denied");
            if (deniedDiv) {
                deniedDiv.style.display = "flex";
            }
        }

        if (tg && typeof tg.expand === "function") {
            try {
                tg.expand();
                console.log("✅ Telegram WebApp expanded");
            } catch(e) {
                console.log("Could not expand Telegram WebApp:", e);
            }
        }

        console.log("✅ Telegram access check passed");

        // ==================== GET USER ID ====================
        function getUserId() {
            let userId = null;

            const urlParams = new URLSearchParams(window.location.search);
            const userIdFromUrl = urlParams.get("user_id");
            if (userIdFromUrl) {
                userId = userIdFromUrl;
            }

            if (!userId && window.Telegram && Telegram.WebApp) {
                try {
                    const user = Telegram.WebApp.initDataUnsafe?.user;
                    if (user && user.id) {
                        userId = user.id.toString();
                    }
                } catch (error) {
                    console.error("Error getting Telegram user:", error);
                }
            }

            if (!userId) {
                let storedUserId = localStorage.getItem("haset_bingo_user_id");
                if (!storedUserId) {
                    storedUserId = Math.floor(Math.random() * 1000000) + 1;
                    localStorage.setItem("haset_bingo_user_id", storedUserId);
                }
                userId = storedUserId;
            }

            return userId;
        }

        const userId = getUserId();
        document.getElementById("user-id-display").textContent = userId;

        // ==================== GET USER BALANCE ====================
        async function getUserBalance() {
            try {
                const response = await fetch(`${API_BASE_URL}/user/balance/${userId}`);
                
                if (!response.ok) {
                    document.getElementById("wallet-balance").textContent = "0.00";
                    return;
                }

                const data = await response.json();
                if (data.success) {
                    const balance = parseFloat(data.balance || 0);
                    document.getElementById("wallet-balance").textContent = balance.toFixed(2);
                    return balance;
                } else {
                    document.getElementById("wallet-balance").textContent = "0.00";
                    return 0;
                }
            } catch (error) {
                console.error("Error fetching balance:", error);
                document.getElementById("wallet-balance").textContent = "0.00";
                return 0;
            }
        }

        // ==================== SHOW INSUFFICIENT BALANCE NOTIFICATION ====================
        function showInsufficientBalance(price, balance) {
            // Remove any existing notifications
            const existing = document.querySelector('.insufficient-balance-notification');
            if (existing) existing.remove();

            const notification = document.createElement('div');
            notification.className = 'insufficient-balance-notification';
            notification.innerHTML = `
                <i class="fas fa-exclamation-circle"></i> 
                Insufficient balance! You need ${price} birr. 
                <strong>Current balance: ${balance.toFixed(2)} birr</strong>
                <span class="small">You need ${(price - balance).toFixed(2)} more birr to join this game.</span>
                <div class="deposit-btn" onclick="this.closest('.insufficient-balance-notification').remove()">
                    <i class="fas fa-times"></i> Dismiss
                </div>
            `;

            document.body.appendChild(notification);

            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.style.animation = 'slideUp 0.3s ease forwards';
                    setTimeout(() => notification.remove(), 300);
                }
            }, 5000);
        }

        // ==================== SELECT GAME WITH BALANCE CHECK ====================
        async function selectGame(price) {
            console.log(`Selected game with card price: ${price} birr`);

            // Store the selected price in localStorage
            localStorage.setItem("haset_bingo_card_price", price.toString());

            // Show loading overlay
            const loadingOverlay = document.getElementById("loadingOverlay");
            loadingOverlay.classList.add("active");

            try {
                // Get fresh balance from server
                const balance = await getUserBalance();

                // Check if user has enough balance
                if (balance < price) {
                    // Hide loading overlay
                    loadingOverlay.classList.remove("active");
                    
                    // Show insufficient balance notification
                    showInsufficientBalance(price, balance);
                    return;
                }

                // Determine which game page to redirect to based on price
                let gamePage;
                if (price === 10) {
                    gamePage = '/game.html';  // 10 birr game
                } else if (price === 20) {
                    gamePage = '/game_20birr.html';  // 20 birr game (VIP)
                } else {
                    gamePage = '/game.html';  // fallback
                }

                // Redirect to the appropriate game page with parameters
                const gameUrl = `${gamePage}?price=${price}&user_id=${userId}`;
                console.log(`Redirecting to: ${gameUrl}`);
                
                // Small delay to show loading state
                setTimeout(() => {
                    window.location.href = gameUrl;
                }, 500);

            } catch (error) {
                console.error("Error during game selection:", error);
                loadingOverlay.classList.remove("active");
                
                // Show error notification
                const notification = document.createElement('div');
                notification.className = 'insufficient-balance-notification';
                notification.style.background = '#FF9800';
                notification.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i> 
                    Error checking balance. Please try again.
                    <div class="deposit-btn" onclick="this.closest('.insufficient-balance-notification').remove()">
                        <i class="fas fa-times"></i> Dismiss
                    </div>
                `;
                document.body.appendChild(notification);
            }
        }

        // ==================== KEYBOARD SHORTCUTS ====================
        document.addEventListener('keydown', function(e) {
            if (e.key === '1') {
                selectGame(10);
            } else if (e.key === '2') {
                selectGame(20);
            }
        });

        // ==================== INITIALIZATION ====================
        async function init() {
            console.log("Initializing index page...");
            await getUserBalance();

            // Check if there's a stored price preference
            const storedPrice = localStorage.getItem("haset_bingo_card_price");
            if (storedPrice) {
                console.log(`Previously selected price: ${storedPrice} birr`);
            }

            // Auto-refresh balance every 30 seconds
            setInterval(getUserBalance, 30000);
        }

        document.addEventListener('DOMContentLoaded', init);

        // ==================== EXPOSE FUNCTIONS TO GLOBAL ====================
        window.selectGame = selectGame;
        window.getUserBalance = getUserBalance;
    </script>

</body>
</html>
